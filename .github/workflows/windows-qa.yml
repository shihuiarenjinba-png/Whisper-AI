name: Windows QA (unsigned)
on:
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        shell: pwsh
        run: python -m compileall -q app.py whisper_local
      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install 'pyinstaller>=6.10,<7'
      - name: Build unsigned QA executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LocalSpeechStudio_QA_UNSIGNED app.py
          if (!(Test-Path dist/LocalSpeechStudio_QA_UNSIGNED.exe)) { throw 'EXE build not found' }
          New-Item -ItemType Directory -Force dist/qa-artifact | Out-Null
          Copy-Item dist/LocalSpeechStudio_QA_UNSIGNED.exe dist/qa-artifact/
          Copy-Item README.md,THIRD_PARTY_NOTICES.md dist/qa-artifact/
          $hash = (Get-FileHash dist/qa-artifact/LocalSpeechStudio_QA_UNSIGNED.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *LocalSpeechStudio_QA_UNSIGNED.exe" | Set-Content -Encoding ascii dist/qa-artifact/SHA256SUMS.txt
          Get-Content dist/qa-artifact/SHA256SUMS.txt
      - name: Upload QA-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalSpeechStudio_QA_UNSIGNED_Windows_x64
          path: dist/qa-artifact/
          if-no-files-found: error
          retention-days: 7
